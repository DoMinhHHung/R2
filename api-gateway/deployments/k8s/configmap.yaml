apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: rental
data:
  APP_ENV: "production"
  APP_PORT: "8080"
  REDIS_ADDR: "redis-service:6379"
  REDIS_DB: "0"
  OTEL_ENDPOINT: "otel-collector:4317"
  OTEL_SERVICE_NAME: "api-gateway"
  SERVICES_AUTH: "http://auth-service:8081"
  SERVICES_USER: "http://user-service:8082"
  SERVICES_PROPERTY: "http://property-service:8083"
  SERVICES_BOOKING: "http://booking-service:8084"
  SERVICES_PAYMENT: "http://payment-service:8085"
  SERVICES_NOTIFICATION: "http://notification-service:8086"
  RATE_LIMIT_IP: "100"
  RATE_LIMIT_USER: "200"
  RATE_LIMIT_API_KEY: "500"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  CB_MAX_REQUESTS: "5"
  CB_INTERVAL_SECONDS: "10"
  CB_TIMEOUT_SECONDS: "30"
  CB_FAILURE_RATIO: "0.6"
  RETRY_MAX_ATTEMPTS: "3"
  RETRY_WAIT_MIN_MS: "100"
  RETRY_WAIT_MAX_MS: "1000"